<body data-axhub-page="admin">
  <div id="root">
    <div id="axhub-admin-boot-loading" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:#64748b;background:hsl(240 6% 96%)">
      <div id="axhub-admin-boot-loading-title" style="font-size:15px;font-weight:600;color:#334155">正在加载管理台…</div>
      <div class="axhub-loading-bar"><div id="axhub-admin-boot-loading-bar" class="axhub-loading-bar__fill"></div></div>
      <div id="axhub-admin-boot-loading-hint" style="max-width:420px;font-size:12px;color:#94a3b8">首次打开需下载约 2–8MB 脚本，外网访问可能需 30–90 秒，请稍候</div>
    </div>

  <script id="axhub-admin-boot-watchdog">
    (function () {
      var BOOT_MS = 120000;
      var VERSION = '1775201871532';
      var titleEl = document.getElementById('axhub-admin-boot-loading-title');
      var hintEl = document.getElementById('axhub-admin-boot-loading-hint');
      var barEl = document.getElementById('axhub-admin-boot-loading-bar');
      var started = Date.now();
      var progress = 6;
      function setProgress(next) {
        progress = Math.max(progress, Math.min(96, next));
        if (barEl) barEl.style.width = progress + '%';
      }
      function assetProgress() {
        var total = 0;
        var loaded = 0;
        try {
          var links = document.querySelectorAll('link[rel="modulepreload"], script[type="module"]');
          total = links.length;
          var entries = performance.getEntriesByType('resource');
          for (var i = 0; i < links.length; i += 1) {
            var href = links[i].getAttribute('href') || links[i].getAttribute('src') || '';
            if (!href) continue;
            for (var j = 0; j < entries.length; j += 1) {
              var entry = entries[j];
              if (entry.name && entry.name.indexOf(href.split('/').pop() || href) !== -1 && entry.responseEnd > 0) {
                loaded += 1;
                break;
              }
            }
          }
        } catch (err) {}
        if (!total) return 0;
        return Math.round((loaded / total) * 70);
      }
      function showBootError(msg) {
        if (document.getElementById('axhub-boot-error') || document.querySelector('.pc-layout')) return;
        var pre = document.createElement('pre');
        pre.id = 'axhub-boot-error';
        pre.style.cssText =
          'position:fixed;z-index:2147483647;inset:12px;margin:0;padding:16px;overflow:auto;background:#fff;border:1px solid #fca5a5;color:#991b1b;font:12px/1.5 ui-monospace,Menlo,monospace;';
        pre.textContent = msg;
        document.body.appendChild(pre);
      }
      function pendingAssets() {
        var names = [];
        try {
          var entries = performance.getEntriesByType('resource');
          for (var i = 0; i < entries.length; i += 1) {
            var e = entries[i];
            if (!e.name || e.name.indexOf('/assets/') === -1) continue;
            if (e.transferSize === 0 && e.duration === 0) names.push(e.name.split('/').pop());
          }
        } catch (err) {}
        return names;
      }
      function clearBootPlaceholder() {
        var boot = document.getElementById('axhub-admin-boot-loading');
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
      }
      var tick = setInterval(function () {
        if (document.querySelector('.pc-layout')) {
          clearBootPlaceholder();
          clearInterval(tick);
          clearTimeout(deadline);
          return;
        }
        var sec = Math.round((Date.now() - started) / 1000);
        if (titleEl) titleEl.textContent = '正在加载管理台…（' + sec + ' 秒）';
        setProgress(Math.max(6 + sec * 2, assetProgress()));
        var pending = pendingAssets();
        if (hintEl && pending.length) {
          hintEl.textContent = '仍在加载：' + pending.slice(0, 3).join('、') + (pending.length > 3 ? ' 等' : '');
        }
      }, 1000);
      var deadline = setTimeout(function () {
        if (document.querySelector('.pc-layout')) return;
        var host = location.hostname;
        var localHint =
          host !== '127.0.0.1' && host !== 'localhost'
            ? '\n\n建议先在本机浏览器打开：http://127.0.0.1:' + (location.port || '51720') + '/\n若本机可开、局域网 IP 不行，多为网络或浏览器扩展拦截大文件。'
            : '';
        showBootError(
          '管理台加载超时（已超过 ' + BOOT_MS / 1000 + ' 秒）：' + location.href +
            '\n\n请打开开发者工具 → Network，查看 vendor-common.js / index.js 是否失败或一直 pending。' +
            '\n然后：硬刷新（Ctrl+Shift+R / Cmd+Shift+R）或清除站点缓存后重试。' +
            localHint
        );
      }, BOOT_MS);
      window.addEventListener(
        'error',
        function (ev) {
          if (document.querySelector('.pc-layout')) return;
          var msg = (ev.error && ev.error.stack) || ev.message || String(ev);
          showBootError('管理台脚本运行失败：\n\n' + msg);
        },
        true
      );
    })();
  </script>
